<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>خصص طلبك | SĒN Café</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--ink:#17201b;
--forest:#25382d;
--olive:#66745d;
--cream:#f3eee4;
--paper:#fbf8f1;
--copper:#b7784f;
--muted:#777d77;
--line:rgba(23,32,27,.12);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:"Tajawal",sans-serif;
background:var(--paper);
color:var(--ink);
}

a{text-decoration:none;color:inherit}
button,input{font-family:inherit}

header{
height:76px;
padding:0 6%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line);
background:rgba(251,248,241,.95);
position:sticky;
top:0;
z-index:20;
}

.brand{
display:flex;
align-items:center;
gap:11px;
font-weight:900;
letter-spacing:2px;
}

.logo{
width:43px;height:43px;
border-radius:50%;
background:var(--ink);
color:white;
display:grid;
place-items:center;
font-size:22px;
}

.back{
padding:11px 17px;
border:1px solid var(--line);
border-radius:100px;
font-size:13px;
font-weight:800;
}

.page{
min-height:calc(100vh - 76px);
display:grid;
grid-template-columns:1fr 1fr;
}

.visual{
position:sticky;
top:76px;
height:calc(100vh - 76px);
overflow:hidden;
}

.visual img{
width:100%;
height:100%;
object-fit:cover;
}

.visual::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(23,32,27,.55),transparent 45%);
}

.visual-label{
position:absolute;
z-index:2;
bottom:38px;
right:38px;
color:white;
}

.visual-label small{
font-size:11px;
letter-spacing:2px;
}

.visual-label h2{
font-size:40px;
margin-top:5px;
}

.panel{
padding:65px 8%;
}

.kicker{
color:var(--copper);
font-size:11px;
font-weight:900;
letter-spacing:2px;
}

.title-row{
display:flex;
justify-content:space-between;
align-items:start;
gap:20px;
margin-top:10px;
}

h1{
font-size:45px;
line-height:1;
}

.base-price{
color:var(--copper);
font-weight:900;
font-size:20px;
}

.description{
color:var(--muted);
line-height:1.8;
margin:16px 0 35px;
}

.group{
padding:27px 0;
border-top:1px solid var(--line);
}

.group-head{
display:flex;
justify-content:space-between;
margin-bottom:16px;
}

.group h3{font-size:16px}
.group small{color:var(--muted)}

.options{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.option{
position:relative;
}

.option input{
position:absolute;
opacity:0;
}

.option label{
min-height:58px;
border:1px solid var(--line);
border-radius:13px;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 15px;
cursor:pointer;
transition:.2s;
font-size:13px;
font-weight:700;
}

.option input:checked + label{
border-color:var(--forest);
background:var(--forest);
color:white;
}

.option label span:last-child{
font-size:11px;
opacity:.7;
}

.extras{
display:grid;
gap:8px;
}

.extra{
position:relative;
}

.extra input{
position:absolute;
opacity:0;
}

.extra label{
border:1px solid var(--line);
border-radius:13px;
padding:15px;
display:flex;
justify-content:space-between;
cursor:pointer;
font-size:13px;
font-weight:700;
}

.extra input:checked + label{
border-color:var(--copper);
background:#f5e9df;
}

.quantity-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:25px 0;
border-top:1px solid var(--line);
}

.qty{
display:flex;
align-items:center;
gap:16px;
}

.qty button{
width:39px;
height:39px;
border:1px solid var(--line);
border-radius:50%;
background:white;
font-size:20px;
cursor:pointer;
}

.qty strong{
min-width:20px;
text-align:center;
}

.add{
width:100%;
border:0;
border-radius:15px;
background:var(--ink);
color:white;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
font-weight:900;
cursor:pointer;
transition:.25s;
}

.add:hover{
background:var(--forest);
transform:translateY(-2px);
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translate(-50%,30px);
background:var(--forest);
color:white;
padding:13px 20px;
border-radius:100px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:100;
font-size:13px;
font-weight:800;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

@media(max-width:850px){
.page{grid-template-columns:1fr}
.visual{
position:relative;
top:0;
height:52vh;
}
.panel{padding:40px 5% 70px}
}

@media(max-width:520px){
header{padding:0 5%}
.visual{height:44vh}
.visual-label{right:22px;bottom:22px}
.visual-label h2{font-size:30px}
h1{font-size:36px}
.options{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<a href="index.html" class="brand">
<div class="logo">س</div>
<span>SĒN</span>
</a>

<a href="menu.html" class="back">← المنيو</a>
</header>

<main class="page">

<section class="visual">
<img id="productImage" src="" alt="">
<div class="visual-label">
<small>MADE YOUR WAY</small>
<h2>على مزاجك.</h2>
</div>
</section>

<section class="panel">

<div class="kicker">SĒN · CUSTOM ORDER</div>

<div class="title-row">
<h1 id="productName"></h1>
<span class="base-price" id="basePrice"></span>
</div>

<p class="description" id="productDescription"></p>


<div class="group drink-option">
<div class="group-head">
<h3>الحجم</h3>
<small>اختر واحد</small>
</div>

<div class="options">
<div class="option">
<input type="radio" name="size" id="regular" value="عادي" data-price="0" checked>
<label for="regular">
<span>عادي</span><span>السعر الأساسي</span>
</label>
</div>

<div class="option">
<input type="radio" name="size" id="large" value="كبير" data-price=".300">
<label for="large">
<span>كبير</span><span>+0.300</span>
</label>
</div>
</div>
</div>


<div class="group drink-option">
<div class="group-head">
<h3>نوع الحليب</h3>
<small>اختر واحد</small>
</div>

<div class="options">
<div class="option">
<input type="radio" name="milk" id="normalMilk" value="عادي" data-price="0" checked>
<label for="normalMilk"><span>حليب عادي</span><span>+0.000</span></label>
</div>

<div class="option">
<input type="radio" name="milk" id="oat" value="شوفان" data-price=".250">
<label for="oat"><span>حليب شوفان</span><span>+0.250</span></label>
</div>

<div class="option">
<input type="radio" name="milk" id="almond" value="لوز" data-price=".250">
<label for="almond"><span>حليب لوز</span><span>+0.250</span></label>
</div>

<div class="option">
<input type="radio" name="milk" id="coconut" value="جوز الهند" data-price=".300">
<label for="coconut"><span>جوز الهند</span><span>+0.300</span></label>
</div>
</div>
</div>


<div class="group drink-option">
<div class="group-head">
<h3>مستوى الحلاوة</h3>
<small>على ذوقك</small>
</div>

<div class="options">
<div class="option">
<input type="radio" name="sweetness" id="sweet0" value="بدون سكر">
<label for="sweet0"><span>بدون</span><span>0%</span></label>
</div>

<div class="option">
<input type="radio" name="sweetness" id="sweet50" value="متوسط" checked>
<label for="sweet50"><span>متوسط</span><span>50%</span></label>
</div>

<div class="option">
<input type="radio" name="sweetness" id="sweet100" value="كامل">
<label for="sweet100"><span>كامل</span><span>100%</span></label>
</div>
</div>
</div>


<div class="group drink-option">
<div class="group-head">
<h3>إضافات</h3>
<small>اختياري</small>
</div>

<div class="extras">

<div class="extra">
<input type="checkbox" id="shot" data-name="شوت إسبريسو إضافي" data-price=".300">
<label for="shot">
<span>شوت إسبريسو إضافي</span>
<span>+0.300 ر.ع</span>
</label>
</div>

<div class="extra">
<input type="checkbox" id="caramel" data-name="كراميل" data-price=".200">
<label for="caramel">
<span>كراميل</span>
<span>+0.200 ر.ع</span>
</label>
</div>

<div class="extra">
<input type="checkbox" id="vanilla" data-name="فانيلا" data-price=".200">
<label for="vanilla">
<span>فانيلا</span>
<span>+0.200 ر.ع</span>
</label>
</div>

</div>
</div>


<div class="quantity-row">
<strong>الكمية</strong>

<div class="qty">
<button onclick="changeQty(-1)">−</button>
<strong id="quantity">1</strong>
<button onclick="changeQty(1)">+</button>
</div>
</div>


<button class="add" onclick="addToCart()">
<span>أضف إلى السلة</span>
<span id="total">0.000 ر.ع</span>
</button>

</section>
</main>

<div class="toast" id="toast">تمت الإضافة إلى السلة ✓</div>

<script>
const products={
spanish:{
name:"Spanish Cloud",
price:1.900,
description:"إسبريسو غني، حليب مخملي وحلاوة متوازنة بتوقيع سِين.",
image:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=1400&q=90",
drink:true
},
pistachio:{
name:"Pistachio Latte",
price:2.100,
description:"لاتيه كريمي بنكهة الفستق ولمسة محمصة ناعمة.",
image:"https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=1400&q=90",
drink:true
},
flatwhite:{
name:"Flat White",
price:1.600,
description:"إسبريسو مزدوج مع حليب ناعم وقوام متوازن.",
image:"https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=1400&q=90",
drink:true
},
coldbrew:{
name:"SĒN Cold Brew",
price:2.000,
description:"استخلاص بارد طويل بنكهة نظيفة ونهاية منعشة.",
image:"https://images.unsplash.com/photo-1517959105821-eaf2591984ca?auto=format&fit=crop&w=1400&q=90",
drink:true
},
icedspanish:{
name:"Iced Spanish",
price:2.000,
description:"سبانش بارد كريمي وخفيف للحظات الطويلة.",
image:"https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=1400&q=90",
drink:true
},
matcha:{
name:"Matcha Cloud",
price:2.200,
description:"ماتشا ناعمة مع حليب وطبقة كريمية خفيفة.",
image:"https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=1400&q=90",
drink:true
},
sansebastian:{
name:"San Sebastian",
price:2.300,
description:"تشيزكيك كريمي بقلب ناعم وسطح محمص.",
image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1400&q=90",
drink:false
},
tiramisu:{
name:"Tiramisu",
price:2.100,
description:"طبقات ناعمة بنكهة القهوة والكاكاو.",
image:"https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=1400&q=90",
drink:false
}
};

const params=new URLSearchParams(location.search);
const id=params.get("item") || "spanish";
const product=products[id] || products.spanish;

let quantity=1;

document.getElementById("productName").textContent=product.name;
document.getElementById("productDescription").textContent=product.description;
document.getElementById("productImage").src=product.image;
document.getElementById("productImage").alt=product.name;
document.getElementById("basePrice").textContent=product.price.toFixed(3)+" ر.ع";

if(!product.drink){
document.querySelectorAll(".drink-option").forEach(el=>el.style.display="none");
}

function selectedPrice(name){
const input=document.querySelector(`input[name="${name}"]:checked`);
return input ? Number(input.dataset.price || 0) : 0;
}

function calculate(){
let unit=product.price;

if(product.drink){
unit+=selectedPrice("size");
unit+=selectedPrice("milk");

document.querySelectorAll('.extra input:checked').forEach(extra=>{
unit+=Number(extra.dataset.price);
});
}

const total=unit*quantity;
document.getElementById("total").textContent=total.toFixed(3)+" ر.ع";
return {unit,total};
}

document.querySelectorAll("input").forEach(input=>{
input.addEventListener("change",calculate);
});

function changeQty(amount){
quantity=Math.max(1,quantity+amount);
document.getElementById("quantity").textContent=quantity;
calculate();
}

function addToCart(){
const prices=calculate();

let size="";
let milk="";
let sweetness="";
let extras=[];

if(product.drink){
size=document.querySelector('input[name="size"]:checked')?.value || "";
milk=document.querySelector('input[name="milk"]:checked')?.value || "";
sweetness=document.querySelector('input[name="sweetness"]:checked')?.value || "";

document.querySelectorAll('.extra input:checked').forEach(extra=>{
extras.push(extra.dataset.name);
});
}

const cart=JSON.parse(localStorage.getItem("senCart")) || [];

cart.push({
id,
name:product.name,
image:product.image,
quantity,
size,
milk,
sweetness,
extras,
unitPrice:prices.unit,
total:prices.total
});

localStorage.setItem("senCart",JSON.stringify(cart));

const toast=document.getElementById("toast");
toast.classList.add("show");

setTimeout(()=>{
window.location.href="cart.html";
},650);
}

calculate();
</script>

</body>
</html>
